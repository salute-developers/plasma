name: Cypress WebKit component testing

on:
    workflow_dispatch:
        inputs:
            pull-request-number:
                description: 'Pull request number'
                required: true
                type: string
            expected-head-sha:
                description: 'Expected PR head SHA to test'
                required: true
                type: string

concurrency:
    group: ${{ github.workflow }}-${{ inputs.pull-request-number }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    prepare:
        name: Resolve pull request
        runs-on: ubuntu-latest
        permissions:
            pull-requests: read
            statuses: write
        outputs:
            base-ref: ${{ steps.pull-request.outputs.base-ref }}
            title: ${{ steps.pull-request.outputs.title }}
            labels: ${{ steps.pull-request.outputs.labels }}
        steps:
            - name: Check pull request and set pending status
              id: pull-request
              uses: actions/github-script@v7
              env:
                  PULL_REQUEST_NUMBER: ${{ inputs.pull-request-number }}
                  EXPECTED_HEAD_SHA: ${{ inputs.expected-head-sha }}
              with:
                  script: |
                      const pullNumber = Number(process.env.PULL_REQUEST_NUMBER);
                      const expectedHeadSha = process.env.EXPECTED_HEAD_SHA;

                      if (!Number.isInteger(pullNumber) || pullNumber <= 0) {
                          core.setFailed('A valid pull request number is required.');
                          return;
                      }

                      const { data: pull } = await github.rest.pulls.get({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          pull_number: pullNumber,
                      });

                      if (pull.state !== 'open') {
                          core.setFailed(`Pull request #${pullNumber} is not open.`);
                          return;
                      }

                      // Код PR выполняется с секретами репозитория.
                      if (pull.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
                          core.setFailed('WebKit tests are allowed only for pull requests from this repository.');
                          return;
                      }

                      if (pull.head.sha !== expectedHeadSha) {
                          core.setFailed(`Pull request head changed to ${pull.head.sha}. Repeat /test-webkit for the new revision.`);
                          return;
                      }

                      await github.rest.repos.createCommitStatus({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          sha: expectedHeadSha,
                          state: 'pending',
                          context: 'Cypress WebKit',
                          description: 'WebKit tests are running',
                          target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                      });

                      core.setOutput('base-ref', pull.base.ref);
                      core.setOutput('title', pull.title);
                      core.setOutput('labels', pull.labels.map(({ name }) => name).join(','));

    state:
        needs: prepare
        uses: ./.github/workflows/change-detection.yml
        with:
            ref: ${{ inputs.expected-head-sha }}
        secrets: inherit

    find_components:
        needs: [prepare, state]
        if: ${{ fromJSON(needs.state.outputs.STATE).HAS_PACKAGES_CYPRESS_RUN }}
        runs-on: ubuntu-latest
        outputs:
            components: ${{ steps.find-components.outputs.components }}
            test-all: ${{ steps.find-components.outputs.test-all }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.ref }}
                  fetch-depth: 0

            - name: Fetch pull request commit
              env:
                  HEAD_SHA: ${{ inputs.expected-head-sha }}
                  BASE_REF: ${{ needs.prepare.outputs.base-ref }}
              run: git fetch --no-tags origin "$BASE_REF" "$HEAD_SHA"

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version-file: '.nvmrc'

            - name: Install dependencies
              run: |
                  cd .github/actions/find-changed-components
                  npm ci

            - name: Find changed components
              id: find-components
              uses: ./.github/actions/find-changed-components
              with:
                  pr-title: ${{ needs.prepare.outputs.title }}
                  pr-labels: ${{ needs.prepare.outputs.labels }}
                  head-sha: ${{ inputs.expected-head-sha }}
                  base-ref: ${{ needs.prepare.outputs.base-ref }}

    cypress_plasma:
        needs: [state, find_components]
        if: ${{ fromJSON(needs.state.outputs.STATE).HAS_PACKAGES_CYPRESS_RUN }}
        strategy:
            fail-fast: false
            matrix:
                scope: ${{ fromJson(needs.state.outputs.STATE).PACKAGES_CYPRESS_RUN_PLASMA }}

        uses: ./.github/workflows/cypress-common.yml
        with:
            scope: ${{ matrix.scope }}
            prefix: 'plasma'
            browser: 'webkit'
            ref: ${{ inputs.expected-head-sha }}
            continue-on-error: false
            components: ${{ needs.find_components.outputs.components }}
            test-all: ${{ needs.find_components.outputs.test-all }}
        secrets: inherit

    cypress_sdds:
        needs: [state, find_components]
        if: ${{ fromJSON(needs.state.outputs.STATE).HAS_PACKAGES_CYPRESS_RUN }}
        strategy:
            fail-fast: false
            matrix:
                scope: ${{ fromJson(needs.state.outputs.STATE).PACKAGES_CYPRESS_RUN_SDDS }}

        uses: ./.github/workflows/cypress-common.yml
        with:
            scope: ${{ matrix.scope }}
            prefix: 'sdds'
            browser: 'webkit'
            ref: ${{ inputs.expected-head-sha }}
            continue-on-error: false
            components: ${{ needs.find_components.outputs.components }}
            test-all: ${{ needs.find_components.outputs.test-all }}
        secrets: inherit

    report:
        name: Report WebKit tests result
        needs: [prepare, state, find_components, cypress_plasma, cypress_sdds]
        if: ${{ always() }}
        runs-on: ubuntu-latest
        permissions:
            issues: write # комментарий в PR
            statuses: write
        steps:
            - name: Set commit status and comment
              uses: actions/github-script@v7
              env:
                  NEEDS: ${{ toJSON(needs) }}
                  PULL_REQUEST_NUMBER: ${{ inputs.pull-request-number }}
                  HEAD_SHA: ${{ inputs.expected-head-sha }}
              with:
                  script: |
                      const results = Object.entries(JSON.parse(process.env.NEEDS)).map(([job, { result }]) => [job, result]);

                      // Отменённый прогон перезапущен новой командой, статус выставит он.
                      if (results.some(([, result]) => result === 'cancelled')) {
                          return;
                      }

                      const failedJobs = results.filter(([, result]) => result === 'failure').map(([job]) => job);
                      const hasRun = results.some(([job, result]) => job.startsWith('cypress_') && result === 'success');
                      const state = failedJobs.length ? 'failure' : 'success';
                      const description = failedJobs.length
                          ? `Failed jobs: ${failedJobs.join(', ')}`
                          : hasRun
                            ? 'WebKit tests finished'
                            : 'No packages to test';
                      const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

                      await github.rest.repos.createCommitStatus({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          sha: process.env.HEAD_SHA,
                          state,
                          context: 'Cypress WebKit',
                          description,
                          target_url: runUrl,
                      });

                      await github.rest.issues.createComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: Number(process.env.PULL_REQUEST_NUMBER),
                          body: [
                              `Cypress WebKit для ${process.env.HEAD_SHA.slice(0, 7)}: **${description}**.`,
                              '',
                              `[Результаты запуска](${runUrl}). Скриншоты расхождений доступны в артефактах \`Failures_Tests_Artifact_*_webkit_\`.`,
                          ].join('\n'),
                      });
