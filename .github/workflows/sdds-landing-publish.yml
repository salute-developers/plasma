name: Publish SDDS landing

on:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: sdds-landing-production
    cancel-in-progress: false

jobs:
    publish:
        runs-on: ubuntu-22.04
        environment: production
        steps:
            -   uses: actions/checkout@v4
                with:
                    ref: master
                    show-progress: false

            -   name: Prepare Node.js
                uses: ./.github/actions/prepare-environment

            -   name: Install dependencies
                run: npm ci --no-audit --no-progress --ignore-scripts

            -   name: Build landing
                run: npm run build --workspace=@salutejs/sdds-landing

            -   name: Install s3cmd
                run: pip3 install s3cmd

            -   name: Publish landing to S3
                env:
                    AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
                    AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                    AWS_ENDPOINT: ${{ secrets.AWS_ENDPOINT }}
                    AWS_REGION: ${{ secrets.AWS_REGION }}
                    AWS_S3_BUCKET_2: ${{ secrets.AWS_S3_BUCKET_2 }}
                run: node website/landing/scripts/publish-obs.mjs
