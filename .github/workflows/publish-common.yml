name: Publish reusable workflow

on:
  workflow_call:
    inputs:
      with-update-package-lock:
        type: boolean
        default: false
      commit-message:
        type: string
        default: 'chore: Update package-lock.json files [skip ci]'
      ref:
        type: string
        description: "Manual set repo ref"
        default: ''
      auto-options:
        type: string
        description: "@auto-it cli arguments for example --no-changelog"
        default: ''
      prepare-since:
        type: string
        description: "Prepare only packages changed since this git ref and their dependencies"
        default: ''
      pull-request-number:
        type: string
        description: "Pull request number for a canary publication"
        default: ''
      expected-head-sha:
        type: string
        description: "Pull request head SHA authorized for canary publication"
        default: ''
    secrets:
      gh_token:
        required: true
      npm_registry_token:
        required: true
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
        id-token: write # выдать OIDC-токен
        contents: read  # для actions/checkout
        pull-requests: write # для записи canary-версий в PR
    env:
      GITHUB_TOKEN: ${{ secrets.gh_token }}
      NPM_REGISTRY_TOKEN: ${{ secrets.npm_registry_token }}
    steps:
      - name: Resolve pull request
        if: inputs.pull-request-number != ''
        id: pull-request
        uses: actions/github-script@v7
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.expected-head-sha }}
          PULL_REQUEST_NUMBER: ${{ inputs.pull-request-number }}
        with:
          github-token: ${{ secrets.gh_token }}
          script: |
            const pullNumber = Number(process.env.PULL_REQUEST_NUMBER);

            if (!Number.isInteger(pullNumber) || pullNumber <= 0) {
              core.setFailed('A valid pull request number is required for a canary publication.');
              return;
            }

            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
            });

            if (pull.state !== 'open') {
              core.setFailed(`Pull request #${pullNumber} is not open.`);
              return;
            }

            if (pull.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed('Canary publication is allowed only for pull requests from this repository.');
              return;
            }

            const expectedHeadSha = process.env.EXPECTED_HEAD_SHA;

            if (expectedHeadSha && pull.head.sha !== expectedHeadSha) {
              core.setFailed(`Pull request #${pullNumber} changed after the canary publication was authorized.`);
              return;
            }

            core.setOutput('ref', expectedHeadSha || `refs/pull/${pullNumber}/merge`);
            core.setOutput('base-sha', pull.base.sha);

      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false
          ref: ${{ steps.pull-request.outputs.ref || inputs.ref }}

      - name: Prepare repository
        run: git fetch --unshallow --tags

      - name: Unset header
        # https://github.com/intuit/auto/issues/1030
        run: git config --local --unset http.https://github.com/.extraheader

      - name: Prepare environment
          # Remote ref (а не локальный ./...) обязателен при публикации canary:
          # иначе action.yml будет загружен из PR-checkout.
        uses: salute-developers/plasma/.github/actions/prepare-environment@dev

      - name: Install dependencies and prepare packages
        env:
          PREPARE_SINCE: ${{ steps.pull-request.outputs.base-sha || inputs.prepare-since }}
        run: |
          if [ -n "$PREPARE_SINCE" ]; then
            npm run setup:ci -- --since="$PREPARE_SINCE" --include-dependencies
          else
            npm run setup:ci
          fi

      - name: Check disk usage after install
        run: df -h

      - name: Release Info
        run: npm whoami && npx lerna info && npx auto info || echo 'auto info returned 1'

      - name: Create Release
        env:
          AUTO_OPTIONS: ${{ inputs.auto-options }}
          PULL_REQUEST_NUMBER: ${{ inputs.pull-request-number }}
        run: |
          if [ -n "$PULL_REQUEST_NUMBER" ]; then
            npx auto canary \
              --pr "$PULL_REQUEST_NUMBER" \
              --build "$GITHUB_RUN_ID" \
              --target pr-body \
              --force \
              -vv
          else
            npm run release -- $AUTO_OPTIONS
          fi

      - name: Update package-lock files
        if: ${{ inputs.with-update-package-lock }}
        uses: ./.github/actions/update-package-lock
        with:
          commit-message: ${{ inputs.commit-message }}
          token: ${{ secrets.gh_token }}
