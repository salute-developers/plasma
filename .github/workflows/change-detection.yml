name: Change detection

on:
  workflow_call:
    inputs:
      exclude-dependents:
        description: 'Lerna boostrap filter-option, exclude all transitive dependents when running a command with --since'
        default: false
        type: boolean
      ref:
          type: string
          description: "Manual set repo ref"
          default: ''
    outputs:
      STATE:
        description: "state based on changed state of lerna packages"
        value: ${{ jobs.run.outputs.STATE }}
jobs:
  run:
    runs-on: ubuntu-latest
    # Токен нужен только для checkout/fetch. Права, переданные вызывающим workflow,
    # здесь принудительно понижаются до чтения - даже если вызывающий имеет write.
    permissions:
      contents: read
    outputs:
      STATE: ${{ steps.state.outputs.STATE }}

    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
          fetch-depth: 0
          # Исполняемые helper-скрипты берём из той же ревизии, что и workflow.
          # Проверяемый inputs.ref только fetch-ится и читается как данные Git.
          ref: ${{ github.workflow_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Computed scope state
        id: state
        env:
          CHANGE_DETECTION_REF: ${{ inputs.ref || github.sha }}
          EXCLUDE_DEPENDENTS: ${{ inputs.exclude-dependents }}
        run: node .github/change-detection.js
