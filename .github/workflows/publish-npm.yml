name: Publish npm

# Единая точка входа для всех публикаций в npm.

on:
    push:
        branches:
            - master
    pull_request:
        branches:
            - master
            - dev
            - next-sbcom
    workflow_dispatch:
        inputs:
            release:
                description: "Release type: dev, next-branch"
                required: true
                type: choice
                options:
                    - rc
                    - next-sbcom

concurrency:
    # PR и dispatch next-*: новый прогон отменяет предыдущий в той же группе.
    # rc и push в master: группа уникальна (run_id) — прогоны не отменяются и не сливаются.
    group: ${{ github.workflow }}-${{ github.head_ref || inputs.release || github.run_id }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' || startsWith(inputs.release, 'next-') }}

jobs:
    publish-canary:
        name: Publish canary version
        # Только PR из этого же репозитория: у fork-PR нет ни секретов, ни id-token.
        # pull_request_target не обрабатываем, поэтому canary для внешних PR не публикуется.
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        permissions:
            id-token: write # выдать OIDC-токен для npm trusted publishing
            contents: read
        uses: ./.github/workflows/publish-common.yml
        with:
            ref: refs/pull/${{ github.event.pull_request.number }}/merge
            auto-options: '--no-changelog'
            prepare-since: ${{ github.event.pull_request.base.sha }}
        secrets:
            gh_token: ${{ secrets.GH_TOKEN }}
            npm_registry_token: ${{ secrets.NPM_REGISTRY_TOKEN }}

    publish-latest:
        name: Publish latest version
        if: github.event_name == 'push'
        permissions:
            id-token: write # выдать OIDC-токен для npm trusted publishing
            contents: read
        uses: ./.github/workflows/publish-common.yml
        with:
            auto-options: '--no-changelog'
        secrets:
            gh_token: ${{ secrets.GH_TOKEN }}
            npm_registry_token: ${{ secrets.NPM_REGISTRY_TOKEN }}

    publish-next:
        name: Release next-sbcom
        if: github.event_name == 'workflow_dispatch' && startsWith(inputs.release, 'next-')
        permissions:
            id-token: write # выдать OIDC-токен для npm trusted publishing
            contents: read
        uses: ./.github/workflows/publish-common.yml
        with:
            ref: ${{ inputs.release }}
            auto-options: '--no-changelog'
        secrets:
            gh_token: ${{ secrets.GH_TOKEN }}
            npm_registry_token: ${{ secrets.NPM_REGISTRY_TOKEN }}

    publish-rc:
        name: Publish release candidate
        if: github.event_name == 'workflow_dispatch' && inputs.release == 'rc'
        permissions:
            id-token: write # выдать OIDC-токен для npm trusted publishing
            contents: read
        uses: ./.github/workflows/publish-common.yml
        with:
            with-update-package-lock: true
            commit-message: "Update package-lock.json files"
            auto-options: '--no-changelog'
        secrets:
            gh_token: ${{ secrets.GH_TOKEN }}
            npm_registry_token: ${{ secrets.NPM_REGISTRY_TOKEN }}

    changelog:
        runs-on: ubuntu-latest
        needs: [publish-latest]
        env:
            GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  show-progress: false
                  fetch-depth: 0
                  ref: master

            - name: Get associated pull request by commit
              id: data
              uses: actions/github-script@v7
              with:
                  result-encoding: string
                  script: |
                      const res = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                          commit_sha: context.sha,
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                      });

                      const data = res?.data[0].body || '';

                      return data;

            - name: Install dependencies
              run: |
                  cd .github/actions/write-changelog
                  npm ci

            - name: Write changelog
              uses: ./.github/actions/write-changelog
              with:
                  data: ${{ steps.data.outputs.result }}

            - name: Extract branch name
              id: branch
              shell: bash
              run: echo "BRANCH=$(echo ${GITHUB_REF#refs/heads/})" >> $GITHUB_OUTPUT

            - name: Commit & Push changelog files
              uses: actions-js/push@master
              with:
                  github_token: ${{ secrets.GH_TOKEN }}
                  message: 'chore: Update CHANGELOG.md [skip ci]'
                  branch: ${{ steps.branch.outputs.BRANCH }}
                  author_name: Salute Frontend Team
                  author_email: salute.developers@gmail.com

    add_comment:
        name: 'Add comments to merged pull requests'
        runs-on: ubuntu-latest
        needs: [publish-latest]
        env:
            GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  show-progress: false
                  fetch-depth: 10
                  ref: master

            - name: Extract commit message
              env:
                  COMMIT_SHA: ${{ github.sha }}
              run: |
                  COMMIT_WITH_VERSION=$(git log --all --format="%H %P %s" | grep "${{ env.COMMIT_SHA }}" | grep "Bump independent versions \[skip ci\]" | awk '{print $1}')
                  COMMIT_MESSAGE=$(git show -s --format=%B "$COMMIT_WITH_VERSION")
                  echo "COMMIT_MESSAGE<<EOF" >> $GITHUB_ENV
                  echo "$COMMIT_MESSAGE" >> $GITHUB_ENV
                  echo "EOF" >> $GITHUB_ENV

            - name: Create comment with version
              id: comment
              uses: actions/github-script@v7
              env:
                  DATA: "${{ env.COMMIT_MESSAGE }}"
              with:
                  result-encoding: string
                  script: |
                      if (!process.env.DATA || !process.env.DATA.length) {
                        console.log('Empty DATA')
                      }

                      const DATA = process.env.DATA
                          .replace(/.*Bump independent versions.*\n?/g, '')
                          .replace(/.*docs.*\n?/g, '')
                          .replace(/.*website.*\n?/g, '')
                          .replace(/.*sdds-clfd-auto.*\n?/g, '')
                          .replace(/^\s*[\r\n]/gm, '')
                          .trim()
                          .split('\n')
                          .map(line => line.trim());

                      const comment = `
                        This PR is included in version:

                        ${DATA.join('\n')}
                      `

                      return comment;

            - name: Get pull requests id's
              id: ids
              uses: actions/github-script@v7
              with:
                  script: |
                      const res = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                          commit_sha: context.sha,
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                      });

                      const data = res?.data[0].body || '';

                      const prRegex = /\[PR\]\(https:\/\/github\.com\/[^\/]+\/[^\/]+\/pull\/(\d+)\)/g;

                      const matches = Array.from(data.matchAll(prRegex));

                      const ids = matches.map(match => parseInt(match[1], 10));

                      return ids;

            - name: Add comments to pull request by ID
              uses: actions/github-script@v7
              with:
                  script: |
                      const listID = ${{ steps.ids.outputs.result }};

                      for (const id of listID) {
                        await github.rest.issues.createComment({
                            owner: context.repo.owner,
                            repo: context.repo.repo,
                            issue_number: id,
                            body: `${{ steps.comment.outputs.result }}`,
                        });
                      }
